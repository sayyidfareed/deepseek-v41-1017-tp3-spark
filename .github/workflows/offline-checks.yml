name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Source manifest and portable launcher
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Quantized export invariants
        run: python3 -B -m unittest discover -s tools/export -p 'test_*.py' -v
